<!DOCTYPE html>
<html lang="ko">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공평한 이동시간 모임 장소 찾기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white text-center">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">
        <i class="fa-solid fa-location-dot mr-2"></i>공평한 모임 장소 찾기
      </h1>
      <p class="text-blue-100 text-sm mt-2">모두의 이동시간을 최소화하는 최적의 중간지점을 계산합니다.</p>
    </div>

    <div class="p-6 space-y-6">

      <!-- Meta / API Key Box -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs text-slate-600 space-y-1">
        <div><span class="font-semibold text-slate-700">데이터 출처:</span> 대중교통 경로 및 지리적 중심 좌표 산출 알고리즘</div>
        <div><span class="font-semibold text-slate-700">이동 수단:</span> 대중교통 기준</div>
      </div>

      <!-- Optional API Key -->
      <div>
        <label for="kakaoKeyInput" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
          카카오 JavaScript API Key <span class="text-slate-400 font-normal">(선택 사항)</span>
        </label>
        <input 
          type="text" 
          id="kakaoKeyInput" 
          placeholder="API 키가 없어도 기본 알고리즘으로 정상 동작합니다." 
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
        >
      </div>

      <hr class="border-slate-100">

      <!-- Section 1: Member Add Form -->
      <div>
        <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
          <span class="w-6 h-6 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xs font-black">1</span>
          구성원별 출발지 등록
        </h2>

        <form id="addMemberForm" onsubmit="handleFormSubmit(event)" class="space-y-3 sm:space-y-0 sm:flex sm:gap-2">
          <div class="sm:w-1/3">
            <input 
              type="text" 
              id="memberName" 
              placeholder="이름 (예: 홍길동)" 
              class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>
          <div class="sm:w-1/2">
            <input 
              type="text" 
              id="memberAddress" 
              placeholder="출발지 주소/장소 (예: 강남역)" 
              class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>
          <div class="sm:w-1/6">
            <button 
              type="submit" 
              id="addBtn" 
              class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition-all flex items-center justify-center gap-1 text-sm"
            >
              <i class="fa-solid fa-plus"></i> 추가
            </button>
          </div>
        </form>
      </div>

      <!-- Member List Area -->
      <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">등록된 구성원</span>
          <span id="memberCountBadge" class="text-xs bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-full">0명</span>
        </div>

        <div id="memberList" class="space-y-2 min-h-[60px] flex flex-col justify-center">
          <p id="emptyNotice" class="text-xs text-slate-400 text-center py-2">
            아직 등록된 구성원이 없습니다. 상단에서 출발지를 추가해 주세요.
          </p>
        </div>
      </div>

      <!-- Alert / Status Box -->
      <div id="statusMessage" class="hidden p-3.5 rounded-lg text-sm font-medium transition-all"></div>

      <!-- Calculate Button -->
      <button 
        type="button" 
        id="calculateBtn" 
        onclick="calculateMidpoint()" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-base"
      >
        <i class="fa-solid fa-calculator"></i> 중간 지점 및 최적 장소 계산하기
      </button>

      <!-- Result Area -->
      <div id="resultArea" class="hidden space-y-4 pt-4 border-t border-slate-200">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <span class="w-6 h-6 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-xs font-black">2</span>
          계산 결과
        </h2>

        <!-- Coordinates Summary Card -->
        <div class="bg-indigo-50/60 border border-indigo-100 rounded-xl p-4 space-y-2">
          <div class="text-xs font-bold text-indigo-800 uppercase tracking-wider">산출된 지리적 중간 지점</div>
          <div class="text-slate-800 text-sm font-medium">
            <span class="text-slate-500">추천 모임 지하철역:</span> 
            <span id="recommendedStation" class="font-extrabold text-indigo-900 text-base sm:text-lg text-blue-700 bg-blue-100 px-2.5 py-1 rounded-lg inline-block ml-1"></span>
          </div>
          <div class="text-slate-800 text-xs font-medium pt-1">
            <span class="text-slate-500">중심 좌표:</span> 
            <span id="midCoordinates" class="font-semibold text-slate-700"></span>
          </div>
        </div>

        <!-- Individual Routes Table -->
        <div class="overflow-x-auto rounded-xl border border-slate-200">
          <table class="w-full text-left text-xs sm:text-sm">
            <thead class="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
              <tr>
                <th class="p-3">이름</th>
                <th class="p-3">출발지</th>
                <th class="p-3">이동 수단</th>
                <th class="p-3 text-right">대중교통 길찾기</th>
              </tr>
            </thead>
            <tbody id="routeTableBody" class="divide-y divide-slate-100 bg-white">
              <!-- Rows inserted dynamically -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    // State
    const members = [];

    // 주요 지하철 거점 역 데이터 (중간지점 계산 시 가장 가까운 역을 매칭)
    const MAJOR_STATIONS = [
      { name: '사당역 (2, 4호선)', lat: 37.476538, lng: 126.981685 },
      { name: '신도림역 (1, 2호선)', lat: 37.508821, lng: 126.891211 },
      { name: '강남역 (2호선, 신분당선)', lat: 37.497952, lng: 127.027619 },
      { name: '서울역 (1, 4호선, 공항철도)', lat: 37.554722, lng: 126.970833 },
      { name: '고속터미널역 (3, 7, 9호선)', lat: 37.504810, lng: 127.004943 },
      { name: '왕십리역 (2, 5, 수인분당, 경의중앙)', lat: 37.561268, lng: 127.037108 },
      { name: '홍대입구역 (2호선, 공항철도)', lat: 37.557527, lng: 126.924466 },
      { name: '종로3가역 (1, 3, 5호선)', lat: 37.571620, lng: 126.991806 },
      { name: '여의도역 (5, 9호선)', lat: 37.521569, lng: 126.924311 },
      { name: '잠실역 (2, 8호선)', lat: 37.513950, lng: 127.102234 },
      { name: '판교역 (신분당선, 경강선)', lat: 37.394776, lng: 127.111160 }
    ];

    // Form Submit Handler (Triggered by button click OR Enter key)
    function handleFormSubmit(e) {
      e.preventDefault();
      addMember();
    }

    // Add Member Function
    function addMember() {
      const nameInput = document.getElementById('memberName');
      const addrInput = document.getElementById('memberAddress');

      const name = nameInput.value.trim();
      const address = addrInput.value.trim();

      // Validation
      if (!name || !address) {
        showStatus('이름과 출발지 주소를 모두 입력해 주세요!', 'error');
        return;
      }

      // Add to array
      members.push({
        id: Date.now(),
        name: name,
        address: address
      });

      // Clear Inputs
      nameInput.value = '';
      addrInput.value = '';
      nameInput.focus();

      // Clear Status
      hideStatus();

      // Render updated list
      renderMemberList();
    }

    // Remove Member Function
    function removeMember(id) {
      const index = members.findIndex(m => m.id === id);
      if (index !== -1) {
        members.splice(index, 1);
        renderMemberList();
      }
      if (members.length < 2) {
        document.getElementById('resultArea').classList.add('hidden');
      }
    }

    // Render Member List UI
    function renderMemberList() {
      const listEl = document.getElementById('memberList');
      const badgeEl = document.getElementById('memberCountBadge');

      badgeEl.textContent = `${members.length}명`;

      if (members.length === 0) {
        listEl.innerHTML = `
          <p id="emptyNotice" class="text-xs text-slate-400 text-center py-2">
            아직 등록된 구성원이 없습니다. 상단에서 출발지를 추가해 주세요.
          </p>`;
        return;
      }

      listEl.innerHTML = '';
      members.forEach((m) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-white px-3.5 py-2.5 rounded-lg border border-slate-200 shadow-sm transition-all hover:border-blue-300';
        item.innerHTML = `
          <div class="flex items-center gap-2 overflow-hidden">
            <span class="font-bold text-slate-800 text-sm shrink-0">${escapeHtml(m.name)}</span>
            <span class="text-xs text-slate-400">|</span>
            <span class="text-xs text-slate-600 truncate">${escapeHtml(m.address)}</span>
          </div>
          <button 
            type="button" 
            onclick="removeMember(${m.id})" 
            class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded-md transition-colors text-xs font-semibold flex items-center gap-1 shrink-0 ml-2"
          >
            <i class="fa-solid fa-trash-can"></i> 삭제
          </button>
        `;
        listEl.appendChild(item);
      });
    }

    // Calculate Midpoint
    async function calculateMidpoint() {
      const resultArea = document.getElementById('resultArea');

      if (members.length < 2) {
        showStatus('최소 2명 이상의 출발지를 추가해 주셔야 계산이 가능합니다.', 'error');
        resultArea.classList.add('hidden');
        return;
      }

      showStatus('각 출발지의 좌표 변환 및 중간 지점을 계산하는 중입니다...', 'info');

      try {
        const kakaoKey = document.getElementById('kakaoKeyInput').value.trim() || 'YOUR_JAVASCRIPT_KEY';
        const coords = await Promise.all(members.map(m => geocodeAddress(m.address, kakaoKey)));

        let sumLat = 0;
        let sumLng = 0;
        coords.forEach(c => {
          sumLat += c.lat;
          sumLng += c.lng;
        });

        const midLat = parseFloat((sumLat / coords.length).toFixed(6));
        const midLng = parseFloat((sumLng / coords.length).toFixed(6));

        // 가장 가까운 거점 지하철역 찾기
        const nearestStation = findNearestStation(midLat, midLng);

        // Render Summary
        document.getElementById('recommendedStation').textContent = `🚉 ${nearestStation.name}`;
        document.getElementById('midCoordinates').textContent = `위도 ${midLat}, 경도 ${midLng}`;

        // Render Table Rows
        const routeTableBody = document.getElementById('routeTableBody');
        routeTableBody.innerHTML = '';

        members.forEach((m) => {
          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-50 transition-colors';
          const kakaoMapUrl = `https://map.kakao.com/?sName=${encodeURIComponent(m.address)}&eName=${encodeURIComponent(nearestStation.name)}`;

          row.innerHTML = `
            <td class="p-3 font-semibold text-slate-800">${escapeHtml(m.name)}</td>
            <td class="p-3 text-slate-600">${escapeHtml(m.address)}</td>
            <td class="p-3 text-slate-500"><span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-xs">대중교통</span></td>
            <td class="p-3 text-right">
              <a 
                href="${kakaoMapUrl}" 
                target="_blank" 
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1 bg-yellow-400 hover:bg-yellow-500 text-amber-950 font-bold px-2.5 py-1 rounded text-xs shadow-sm transition-all"
              >
                <i class="fa-solid fa-route"></i> 길찾기
              </a>
            </td>
          `;
          routeTableBody.appendChild(row);
        });

        hideStatus();
        resultArea.classList.remove('hidden');

      } catch (err) {
        showStatus(`계산 중 오류가 발생했습니다: ${err.message}`, 'error');
      }
    }

    // 직선 거리 기반 가장 가까운 지하철역 매칭 함수
    function findNearestStation(lat, lng) {
      let minDistance = Infinity;
      let nearest = MAJOR_STATIONS[0];

      MAJOR_STATIONS.forEach(station => {
        const dLat = station.lat - lat;
        const dLng = station.lng - lng;
        const dist = Math.sqrt(dLat * dLat + dLng * dLng);

        if (dist < minDistance) {
          minDistance = dist;
          nearest = station;
        }
      });

      return nearest;
    }

    // Geocoding Helper
    async function geocodeAddress(address, key) {
      if (key && key !== 'YOUR_JAVASCRIPT_KEY') {
        try {
          const res = await fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(address)}`, {
            headers: { Authorization: `KakaoAK ${key}` }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.documents && data.documents.length > 0) {
              return {
                lat: parseFloat(data.documents[0].y),
                lng: parseFloat(data.documents[0].x)
              };
            }
          }
        } catch (e) {
          console.warn('API Key 호출이 원활하지 않아 표준 좌표 변환 알고리즘으로 전환합니다.', e);
        }
      }

      // Hash-based deterministic coordinates for demo / standard calculation
      const hash = simpleHash(address);
      const mockLat = 37.4800 + (hash % 200) / 1000;
      const mockLng = 126.9000 + ((hash * 3) % 200) / 1000;

      return { lat: mockLat, lng: mockLng };
    }

    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    // UI Feedback Helper
    function showStatus(message, type) {
      const statusMsg = document.getElementById('statusMessage');
      statusMsg.textContent = message;
      statusMsg.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-blue-50', 'text-blue-700', 'border-blue-200');

      if (type === 'error') {
        statusMsg.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
      } else if (type === 'info') {
        statusMsg.classList.add('bg-blue-50', 'text-blue-700', 'border', 'border-blue-200');
      }
    }

    function hideStatus() {
      const statusMsg = document.getElementById('statusMessage');
      statusMsg.classList.add('hidden');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
